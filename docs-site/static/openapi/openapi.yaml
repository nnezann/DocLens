openapi: 3.1.0
info:
  title: DocLens API
  version: 0.1.0
  description: Public REST API exposed by the DocLens API Gateway.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Identity
  - name: Documents
  - name: Verifications
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check gateway liveness
      security: []
      responses:
        '200':
          description: Gateway is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      tags: [Health]
      summary: Check service readiness
      security: []
      responses:
        '200':
          description: Gateway and upstream services are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /identity/login:
    post:
      tags: [Identity]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens and user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/users:
    post:
      tags: [Identity]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents:
    post:
      tags: [Documents]
      summary: Create a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document metadata
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}/uploads:
    post:
      tags: [Documents]
      summary: Upload document bytes
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '202':
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}/status:
    get:
      tags: [Documents]
      summary: Get document processing status
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Current document status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verifications:
    post:
      tags: [Verifications]
      summary: Start verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartVerificationRequest'
      responses:
        '202':
          description: Verification accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verifications/{id}:
    get:
      tags: [Verifications]
      summary: Get verification
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: {type: string}
    OrganizationId:
      name: organization_id
      in: query
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Upstream service is not ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Status:
      type: object
      required: [status]
      properties:
        status: {type: string}
        service: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        user: {$ref: '#/components/schemas/User'}
    CreateUserRequest:
      type: object
      required: [organization_id, email, password]
      properties:
        organization_id: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
        roles:
          type: array
          items: {type: string}
    User:
      type: object
      properties:
        id: {type: string}
        organization_id: {type: string}
        email: {type: string, format: email}
        roles:
          type: array
          items: {type: string}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
    CreateDocumentRequest:
      type: object
      required: [type, filename, content_base64]
      properties:
        organization_id: {type: string}
        type: {type: string}
        filename: {type: string}
        content_type: {type: string}
        content_base64: {type: string, format: byte}
    UploadDocumentRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string}
        content_type: {type: string}
        content_base64: {type: string, format: byte}
        idempotency_key: {type: string}
    UploadResponse:
      type: object
      properties:
        upload_id: {type: string}
        document_id: {type: string}
        storage_ref: {type: string}
        checksum: {type: string}
    Document:
      type: object
      properties:
        id: {type: string}
        organization_id: {type: string}
        type: {type: string}
        filename: {type: string}
        content_type: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
        uploads:
          type: array
          items: {$ref: '#/components/schemas/Upload'}
    Upload:
      type: object
      properties:
        id: {type: string}
        filename: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer, format: int64}
        checksum: {type: string}
        storage_ref: {type: string}
        created_at: {type: string, format: date-time}
    DocumentStatus:
      type: object
      properties:
        document_id: {type: string}
        status: {type: string}
        processing_job_status: {type: string}
        updated_at: {type: string, format: date-time}
    StartVerificationRequest:
      type: object
      required: [document_id]
      properties:
        organization_id: {type: string}
        document_id: {type: string}
        checks:
          type: array
          items: {type: string}
    Verification:
      type: object
      properties:
        id: {type: string}
        document_id: {type: string}
        organization_id: {type: string}
        risk_score: {type: integer, format: int32}
        status: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
security:
  - bearerAuth: []
